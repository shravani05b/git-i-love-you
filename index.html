<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>I love you</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>

    :root {

      --bg1: #ffd6e7;

      --bg2: #ffeef6;

      --card: #ffffffcc;

      --yes: #ff3b7a;

      --yesHover: #ff1f68;

    }

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100svh;

      display: grid;

      place-items: center;

      background: radial-gradient(circle at top, var(--bg2), var(--bg1));

      font-family: system-ui, sans-serif;

      overflow: hidden;

      padding: 16px;

    }

    #confettiCanvas {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;

      pointer-events: none;

      z-index: 9999;

    }

    .card {

      width: min(720px, 92vw);

      padding: 26px 22px;

      background: var(--card);

      backdrop-filter: blur(10px);

      border-radius: 22px;

      text-align: center;

      box-shadow: 0 18px 60px rgba(0,0,0,.15);

    }

    .art {

      width: min(260px, 80vw);

      margin: 0 auto 10px;

      display: block;

    }

    h1 {

      font-size: clamp(26px, 4vw, 44px);

      margin: 12px 0 18px;

    }

    .button-zone {

      position: relative;

      width: min(520px, 92%);

      height: 150px;

      margin: 0 auto;

      touch-action: none;

    }

    button {

      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      padding: 16px 24px;

      font-size: 18px;

      font-weight: 800;

      border-radius: 999px;

      border: none;

      cursor: pointer;

      box-shadow: 0 10px 24px rgba(0,0,0,.14);

      transition: transform .12s ease, background .12s ease;

    }

    #yesBtn {

      left: 12%;

      background: var(--yes);

      color: #fff;

    }

    #noBtn {

      left: 58%;

      background: #e5e7eb;

      color: #111827;

    }

    .hint {

      margin-top: 10px;

      font-size: 13px;

      opacity: .7;

    }

    .result {

      display: none;

      margin-top: 18px;

    }
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<main class="card">
<h1>I love you ❤️</h1>
<section class="button-zone" id="zone">
<button id="yesBtn">I love you too 💕</button>
<button id="noBtn">You can’t escape 😌</button>
</section>
<div class="hint" id="hint">Go on… click it 😏</div>
<section class="result" id="result">
<h2>Forever 💖</h2>
<img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" width="300">
</section>
</main>
<script>

  const zone = document.getElementById("zone");

  const yesBtn = document.getElementById("yesBtn");

  const noBtn = document.getElementById("noBtn");

  const result = document.getElementById("result");

  const hint = document.getElementById("hint");

  const confettiCanvas = document.getElementById("confettiCanvas");

  confettiCanvas.width = window.innerWidth;

  confettiCanvas.height = window.innerHeight;

  const confettiInstance = confetti.create(confettiCanvas, { resize: true });

  function fullScreenConfetti() {

    confettiInstance({ particleCount: 300, spread: 160 });

  }

  let yesScale = 1;

  function growYes() {

    yesScale += 0.1;

    yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;

  }

  function moveNo(x, y) {

    noBtn.style.left = Math.random() * 70 + "%";

    noBtn.style.top = Math.random() * 60 + "%";

    growYes();

  }

  zone.addEventListener("pointermove", e => moveNo(e.clientX, e.clientY));

  yesBtn.addEventListener("click", () => {

    zone.style.display = "none";

    hint.style.display = "none";

    result.style.display = "block";

    fullScreenConfetti();

  });
</script>
</body>
</html>
